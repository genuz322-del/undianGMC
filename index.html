    if (rune && dur < 450) { rune.classList.remove("tap"); void rune.offsetWidth; rune.classList.add("tap"); buzz(); runeAction(+rune.dataset.k); }
    else if (inP) { if (dur >= 450) setTheme(S.theme % 3 + 1); else { buzz(); togglePanel(true); } }
  }
  down = null;
}
hud.addEventListener("pointerup", end); hud.addEventListener("pointercancel", end);

/* ---------- loop ---------- */
let last = 0, wRot = 1e9, lowN = 0, looping = false, fpsBusy = false;
function spin(now) {
  if (!dragging && Math.abs(inertia) <= .018 && Math.abs(tgt - ang) < .02) { looping = false; return; }
  const dt = Math.min(34, now - (last || now - 16)); last = now;
  if (!dragging) { if (Math.abs(inertia) > .018) { tgt += inertia * dt; inertia *= Math.pow(.9, dt / 16); } else inertia = 0; }
  ang += (tgt - ang) * (1 - Math.exp(-dt / 38));
  if (Math.abs(ang - wRot) > .02) { wRot = ang; rotor.style.transform = "rotate(" + ang.toFixed(2) + "deg)"; }
  requestAnimationFrame(spin);
}
const kick = () => { if (!looping) { looping = true; last = 0; requestAnimationFrame(spin); } };
function sampleFps() {
  const c = R.classList; if (fpsBusy || document.hidden || c.contains("scrolling") || !c.contains("live2") || (!S.stats && !(S.adapt && !S.eco))) return;
  fpsBusy = true; let n = 0; const t0 = performance.now();
  const tick = now => {
    n++; if (now - t0 < 1000) { requestAnimationFrame(tick); return; }
    fpsBusy = false; if (c.contains("scrolling") || dragging) return;
    const f = Math.round(n * 1000 / (now - t0));
    if (S.stats) { const el = $("st-fps"); setTxt(el, String(f)); el.setAttribute("fill", f < 25 ? "#ff6b5a" : f < 45 ? "#ffd36b" : "#7dffb0"); }
    if (S.adapt && !S.eco) { if (f < 40) { if (++lowN >= 2 && !c.contains("lowfx")) { c.add("lowfx"); toast("Efek dikurangi otomatis agar tetap mulus"); } } else lowN = 0; }
  };
  requestAnimationFrame(tick);
}
setInterval(sampleFps, 5000);

/* ---------- jam, tanggal, baterai, ping, timer, jaga ---------- */
const DAYS = ["MIN", "SEN", "SEL", "RAB", "KAM", "JUM", "SAB"], MON = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGU", "SEP", "OKT", "NOV", "DES"];
function syncClock() {
  const d = new Date(), sec = d.getSeconds() + d.getMilliseconds() / 1000, min = d.getMinutes(), h = d.getHours() % 12;
  $("h-sec").style.animationDelay = -sec + "s"; $("h-min").style.animationDelay = -(min * 60 + sec) + "s"; $("h-hr").style.animationDelay = -(h * 3600 + min * 60 + sec) + "s";
  setTxt($("date"), DAYS[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()]);
}
function battery() {
  const b0 = $("st-bat"); if (!navigator.getBattery) { setTxt(b0, "-"); return; }
  navigator.getBattery().then(b => { const u = () => { const lv = Math.round(b.level * 100); setTxt(b0, lv + "%" + (b.charging ? " ⚡" : "")); b0.setAttribute("fill", lv <= 20 && !b.charging ? "#ff6b5a" : "#ffffff"); if (S.alert && lv <= 20 && !b.charging && !lowWarned) { lowWarned = true; toast("Kapal bocor! Baterai tinggal " + lv + "%", 4000); buzz([150, 80, 150]); } if (lv > 25 || b.charging) lowWarned = false; }; u(); b.addEventListener("levelchange", u); b.addEventListener("chargingchange", u); }).catch(() => setTxt(b0, "-"));
}
async function ping() {
  if (!S.stats || document.hidden) return; const t0 = performance.now(), el = $("st-ping");
  try { await fetch("https://www.gstatic.com/generate_204", {mode: "no-cors", cache: "no-store"}); const ms = Math.round(performance.now() - t0); setTxt(el, ms + " ms"); el.setAttribute("fill", ms > 200 ? "#ff6b5a" : ms > 100 ? "#ffd36b" : "#7dffb0"); } catch (e) { setTxt(el, "-"); el.setAttribute("fill", "#fff"); }
}
const T0 = Date.now(), pad = n => String(n).padStart(2, "0");
function sailTime(force) {
  if (tEnd) { const r = Math.ceil((tEnd - Date.now()) / 1000); if (r <= 0) { tEnd = 0; toast("Timer selesai, Kapten!", 5000); buzz([250, 100, 250, 100, 250]); } else { setTxt($("st-lbl"), "Timer "); setTxt($("st-time"), Math.floor(r / 60) + ":" + pad(r % 60)); return; } }
  if (!S.stats && !force) return; if (document.hidden) return;
  const s = Math.floor((Date.now() - T0) / 1000); setTxt($("st-lbl"), "Berlayar "); setTxt($("st-time"), Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60));
}
function breakCheck() { if (!S.brk || Date.now() - lastBrk < S.bi * 60000) return; lastBrk = Date.now(); toast("Ganti jaga, Kapten! Sudah " + S.bi + " menit, istirahat sebentar", 5000); buzz([200, 100, 200]); }
window.addEventListener("offline", () => { if (S.alert) { toast("Sinyal hilang, kapal terombang-ambing", 3500); buzz([120, 60, 120]); } });
window.addEventListener("online", () => { if (S.alert) toast("Sinyal kembali"); });
battery(); setTimeout(ping, 6000); setInterval(ping, 10000); setInterval(sailTime, 1000); setInterval(breakCheck, 20000); syncClock(); setInterval(syncClock, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { syncClock(); lock(); } });

/* ---------- masuk dan keluar: layer bergantian, hanya transform + opacity ---------- */
let hudT, liveT;
const setBtn = () => $("btn-hud").classList.toggle("off", !!S.hidden);
function showHUD() {
  clearTimeout(hudT); clearTimeout(liveT); R.classList.remove("pre", "hid", "out", "live", "live2", "go"); void R.offsetWidth; R.classList.add("go"); syncClock(); if (!photoOn) { photoOn = true; requestAnimationFrame(applyPhoto); }
  S.hidden = false; save(); setBtn(); liveT = setTimeout(() => { R.classList.add("live"); liveT = setTimeout(() => R.classList.add("live2"), 450); }, 1050);
}
function hideHUD() {
  clearTimeout(hudT); clearTimeout(liveT); R.classList.remove("go", "live", "live2", "pre"); void R.offsetWidth; R.classList.add("out");
  S.hidden = true; save(); setBtn(); hudT = setTimeout(() => { R.classList.remove("out"); R.classList.add("hid"); }, 800);
}
$("btn-hud").addEventListener("click", () => { buzz(); S.hidden ? showHUD() : hideHUD(); });
const ready = cb => requestAnimationFrame(() => cb());
const startIntro = () => { if (S.hidden) { R.classList.remove("pre"); R.classList.add("hid"); setBtn(); return; } showHUD(); };
(() => {
  const dash = document.getElementById("dashboard-container"); if (!dash) { ready(startIntro); return; }
  let n = 0; const t = setInterval(() => { n++; const ok = dash.classList.contains("show-dashboard"); if (ok || n > 100) { clearInterval(t); ready(startIntro); } }, 60);
})();
let scT; const onScr = () => { if (!R.classList.contains("scrolling")) R.classList.add("scrolling"); clearTimeout(scT); scT = setTimeout(() => R.classList.remove("scrolling"), 220); };
window.addEventListener("scroll", onScr, {capture: true, passive: true}); window.addEventListener("wheel", onScr, {capture: true, passive: true});
window.addEventListener("touchmove", () => { if (!dragging) onScr(); }, {capture: true, passive: true});
applyNow();
})();
